# Gruvbox Dark Hard, matching rio/themes/gruvbox-dark-hard.toml.
#
# Template for the colour scheme Contour loads as gruvbox-dark-hard. rotate-background.sh
# copies it to colorschemes/gruvbox-dark-hard.yml beside contour.yml, adding a
# background_image block with a randomly chosen image from backgrounds/.

default:
    background: '#1d2021'
    foreground: '#d5c4a1'
    bright_foreground: '#ebdbb2'
    dimmed_foreground: '#928374'

cursor:
    default: '#d5c4a1'
    text: '#1d2021'

selection:
    foreground: '#d5c4a1'
    foreground_alpha: 1.0
    background: '#504945'
    background_alpha: 1.0

search_highlight:
    foreground: '#1d2021'
    foreground_alpha: 1.0
    background: '#d79921'
    background_alpha: 1.0

search_highlight_focused:
    foreground: '#1d2021'
    foreground_alpha: 1.0
    background: '#b8bb26'
    background_alpha: 1.0

hint_label:
    foreground: '#1d2021'
    foreground_alpha: 1.0
    background: '#fabd2f'
    background_alpha: 1.0

normal:
    black:   '#282828'
    red:     '#cc241d'
    green:   '#98971a'
    yellow:  '#d79921'
    blue:    '#458588'
    magenta: '#b16286'
    cyan:    '#689d6a'
    white:   '#a89984'

bright:
    black:   '#928374'
    red:     '#fb4934'
    green:   '#b8bb26'
    yellow:  '#fabd2f'
    blue:    '#83a598'
    magenta: '#d3869b'
    cyan:    '#8ec07c'
    white:   '#ebdbb2'

dim:
    black:   '#32302f'
    red:     '#9d0006'
    green:   '#79740e'
    yellow:  '#b57614'
    blue:    '#076678'
    magenta: '#8f3f71'
    cyan:    '#427b58'
    white:   '#928374'
