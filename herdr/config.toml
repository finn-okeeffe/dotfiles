# herdr configuration, adapted from zellij/config.kdl.
#
# Zellij starts locked and Ctrl+Space unlocks normal mode, where a letter enters
# a sub-mode (p pane, t tab, r resize). Herdr has one prefix layer instead, so
# Ctrl+Space is the prefix and the pane- and tab-mode letters are flattened into
# it: lowercase keys act on panes, shifted keys act on tabs. The Alt shortcuts
# zellij binds in locked mode work directly, without the prefix.

onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[keys]
prefix = "ctrl+space"

# Zellij locked-mode shortcuts
focus_pane_left = ["alt+h", "alt+left", "prefix+h", "prefix+left"]
focus_pane_down = ["alt+j", "alt+down", "prefix+j", "prefix+down"]
focus_pane_up = ["alt+k", "alt+up", "prefix+k", "prefix+up"]
focus_pane_right = ["alt+l", "alt+right", "prefix+l", "prefix+right"]
move_tab_previous = "alt+i"
move_tab_next = "alt+o"

# Zellij pane mode (p)
split_vertical = ["alt+n", "prefix+n", "prefix+v"]
split_horizontal = ["prefix+d", "prefix+minus"]
close_pane = "prefix+x"
zoom = "prefix+f"
rename_pane = "prefix+c"
cycle_pane_next = "prefix+tab"

# Zellij tab mode (t)
new_tab = "prefix+t"
close_tab = "prefix+shift+x"
rename_tab = "prefix+shift+t"
previous_tab = ["prefix+shift+h", "prefix+shift+k"]
next_tab = ["prefix+shift+l", "prefix+shift+j"]
switch_tab = "prefix+1..9"

# Zellij resize mode (r) and scroll mode (s, then e)
resize_mode = "prefix+r"
edit_scrollback = "prefix+e"

# Zellij session mode (o, then w or d): herdr workspaces stand in for sessions
workspace_picker = "prefix+w"
detach = "prefix+q"

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true
