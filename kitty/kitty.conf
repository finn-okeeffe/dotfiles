# Keep terminal colours separate, matching the Alacritty configuration layout.
include colors.gruvbox-dark-hard.conf

# Font
font_family Mononoki Nerd Font Mono
font_size 16.0

# Window
window_padding_width 20
placement_strategy center
background_opacity 1.0
hide_window_decorations yes
remember_window_size no
startup_session startup.session

# Scrolling
scrollback_lines 100000

# Behaviour
auto_reload_config 0.1
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# Approximate Alacritty's hint-start colour; Kitty uses one hint colour rather
# than separate start and end colours.
kitten_alias hints hints --hints-foreground-color #1d2021 --hints-background-color #fabd2f

shell /bin/zsh
env SHELL=/bin/zsh
env read_from_shell=PATH EDITOR VISUAL
